<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qalculater</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" v-cloak>
    <main id="history" ref="historyEl">
        <div class="entry py-1" v-for="(entry, i) in entries" :key="i">
            <div class="expr px-3">{{ entry.expr }}</div>
            <div class="result">
                <span class="sign">{{ entry.expr_fmt !== entry.result ? (entry.approx ? '≈' : '=') : '' }}</span>{{ entry.result }}
                <div class="entry-error error" v-for="(e, i) in entry.errors" :key="'e'+i"><span class="error-mark">!</span><span>{{ e }}</span></div>
                <div class="entry-error warning" v-for="(e, i) in entry.warnings" :key="'w'+i"><span class="error-mark">!</span><span>{{ e }}</span></div>
            </div>
        </div>
    </main>
    <footer>
        <div id="dropdown" v-if="browser" @keydown.escape="closeBrowser">
            <input id="browser-search" class="px-3 py-1" v-model="browserSearch" :placeholder="'search ' + browser"
                   autocomplete="off" spellcheck="false" @click.stop>
            <div class="fn-list">
                <template v-for="group in groupedItems" :key="group.category">
                    <div class="fn-cat px-3 py-1">{{ group.category }}</div>
                    <button class="fn-item px-3 py-1" v-for="item in group.items" :key="item.name" @click="insertItem(item.name)">
                        <span>{{ item.name }}</span>
                        <span class="fn-title">{{ item.title }}</span>
                    </button>
                </template>
                <div class="fn-empty px-3 py-1" v-if="!groupedItems.length">no matches</div>
            </div>
        </div>
        <div id="ac" v-if="acItems.length">
            <button v-for="(it, i) in acItems" :key="it.name + i"
                    :class="{ active: i === acIndex }"
                    @mousedown.prevent="acceptCompletion" @mouseenter="acIndex = i">
                <span>{{ it.name }}</span>
                <span class="fn-title">{{ it.title }}</span>
            </button>
        </div>
        <div id="hint" v-if="hint">{{ hint }}</div>
        <label id="preview" for="input"></label>
        <textarea id="input" class="px-3 py-0" rows="1" v-model="input"
               @keydown="onKeydown" @input="updateAc" @click="updateAc" @keyup="updateAc"
               autofocus autocomplete="off" spellcheck="false"
               placeholder="type an expression and press enter"></textarea>
        <div id="toolbar">
            <button class="px-3 py-1" @click="toggleBrowser('functions')" :class="{ active: browser === 'functions' }">functions</button>
            <button class="px-3 py-1" @click="toggleBrowser('variables')" :class="{ active: browser === 'variables' }">variables</button>
            <button class="px-3 py-1" @click="toggleBrowser('units')" :class="{ active: browser === 'units' }">units</button>
            <button class="px-3 py-1" @click="clearHistory">clear</button>
        </div>
    </footer>
</div>
<script src="vue.global.prod.js"></script>
<script src="main.js"></script>
<script src="qalc.js"></script>
</body>
</html>
